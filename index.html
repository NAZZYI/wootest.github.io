<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Clipper</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

<h1>🎬 Automatic Video Clipper</h1>

<p>
Upload a video and split it into equal clips automatically.
</p>


<input 
type="file" 
id="videoFile" 
accept="video/*">


<video 
id="video" 
controls>
</video>


<label>
How many clips?
</label>


<select id="clipNumber">

<option value="2">2 Clips</option>
<option value="3">3 Clips</option>
<option value="4" selected>4 Clips</option>
<option value="5">5 Clips</option>
<option value="10">10 Clips</option>

</select>


<button id="clipButton">
Create Clips
</button>


<div id="message">
Waiting for video...
</div>


<div id="clips">
</div>


</div>


<script type="module" src="script.js"></script>

</body>

</html>
